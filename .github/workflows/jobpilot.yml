# JobPilot — le robot de recherche d'emploi (100 % gratuit : GitHub Actions + GitHub Pages).
#  • Chaque matin : récupère les offres, les note, met à jour le tableau de bord.
#  • Quand tu ouvres un ticket « Postuler: <id> » (bouton du tableau de bord) : prépare le CV adapté,
#    la lettre, les PDF, envoie l'e-mail si l'offre le permet, puis répond dans le ticket.
name: JobPilot

on:
  schedule:
    - cron: '17 5 * * *'   # ≈ 6 h 17 / 7 h 17 à Paris
  workflow_dispatch:
    inputs:
      apply:
        description: "Identifiants d'offres pour lesquelles postuler (optionnel, séparés par des espaces)"
        required: false
        default: ''
  issues:
    types: [opened]
  push:
    paths:
      - 'jobpilot/profile/**'
      - 'jobpilot/src/**'
      - 'jobpilot/web/**'
      - '.github/workflows/jobpilot.yml'

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: jobpilot
  cancel-in-progress: false

jobs:
  run:
    # Seul le propriétaire du dépôt peut déclencher une candidature via un ticket.
    if: >-
      github.event_name != 'issues' ||
      (startsWith(github.event.issue.title, 'Postuler') && github.event.issue.user.login == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: jobpilot
    env:
      FT_CLIENT_ID: ${{ secrets.FT_CLIENT_ID }}
      FT_CLIENT_SECRET: ${{ secrets.FT_CLIENT_SECRET }}
      ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      AUTO_SEND: ${{ vars.AUTO_SEND }}
      CV_PHONE: ${{ secrets.CV_PHONE }}
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm test

      - name: Adresse du site
        id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
      - name: URL publique
        run: |
          URL="${{ steps.pages.outputs.base_url }}"
          if [ -z "$URL" ]; then
            OWNER="${GITHUB_REPOSITORY%%/*}"; REPO="${GITHUB_REPOSITORY#*/}"
            URL="https://${OWNER,,}.github.io/${REPO}"
          fi
          echo "SITE_URL=$URL" >> "$GITHUB_ENV"

      - name: Rechercher les offres
        if: github.event_name != 'issues' && inputs.apply == ''
        run: node src/fetch-jobs.mjs

      - name: Préparer les candidatures
        if: github.event_name == 'issues' || inputs.apply != ''
        env:
          ISSUE_TEXT: ${{ github.event.issue.title }} ${{ github.event.issue.body }} ${{ inputs.apply }}
        run: |
          IDS=$(node -e '
            const fs = require("fs");
            const jobs = require("./data/jobs.json").jobs.concat(fs.existsSync("./data/companies.json") ? require("./data/companies.json").companies : []);
            const t = process.env.ISSUE_TEXT || "";
            console.log(jobs.filter(j => t.includes(j.id)).map(j => j.id).join(" "));
          ')
          if [ -z "$IDS" ]; then echo "Aucune offre reconnue dans le ticket."; echo "NO_IDS=1" >> "$GITHUB_ENV"; exit 0; fi
          node src/apply.mjs $IDS

      - name: Construire le site
        run: node src/build-site.mjs

      - name: Sauvegarder les données
        run: |
          git config user.name "jobpilot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Rien de nouveau."; exit 0; fi
          git commit -m "JobPilot : mise à jour des offres et candidatures [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Répondre dans le ticket
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          if [ -n "$NO_IDS" ]; then
            gh issue comment "$ISSUE" --body "Je n'ai reconnu aucune offre dans ce ticket. Utilise le bouton « Postuler » du tableau de bord : $SITE_URL/pilote/"
            exit 0
          fi
          node -e '
            const r = require("./data/last-apply.json"); const base = process.env.SITE_URL;
            const lines = r.map(a => a.error ? `- ❌ ${a.id} : ${a.error}` : [
              `### ${a.company} — ${a.title}`,
              `- 📄 [CV adapté](${base}/candidatures/${a.folder}/cv.pdf) · [version web](${base}/candidatures/${a.folder}/cv.html)`,
              `- ✉️ [Lettre de motivation](${base}/candidatures/${a.folder}/lettre.pdf) — ${a.letterSource}`,
              `- 🎯 Compétences mises en avant : ${a.matched.join(", ") || "—"}`,
              a.missing.length ? `- ⚠️ Demandé par l offre mais absent de ton profil (non ajouté) : ${a.missing.join(", ")}` : "",
              `- 📬 Envoi : ${a.sent}`,
              `- 🔗 [Offre](${a.url})`,
            ].filter(Boolean).join("\n"));
            require("fs").writeFileSync("/tmp/comment.md", lines.join("\n\n") + "\n\n_Le site est mis à jour dans ~1 minute._");
          '
          gh issue comment "$ISSUE" --body-file /tmp/comment.md
          gh issue close "$ISSUE"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: jobpilot/site

  deploy:
    needs: run
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
