# JobPilot — le robot de recherche d'emploi (100 % gratuit : GitHub Actions + GitHub Pages).
#  • Recherche (chaque matin, à chaque modification du profil, ou « Chercher maintenant ») :
#    récupère et note les offres, prépare les candidatures automatiques, met le site à jour.
#  • Candidature (bouton « Postuler » de l'interface) : chemin rapide, ~1 minute — CV adapté,
#    lettre, PDF, envoi de l'e-mail si l'offre le permet. Plusieurs candidatures peuvent tourner
#    en parallèle et n'attendent pas la fin d'une recherche.
name: JobPilot

on:
  schedule:
    - cron: '17 5 * * *'   # ≈ 6 h 17 / 7 h 17 à Paris
  workflow_dispatch:
    inputs:
      apply:
        description: "Identifiants d'offres pour lesquelles postuler (vide = recherche)"
        required: false
        default: ''
  push:
    paths:
      - 'jobpilot/profile/**'
      - 'jobpilot/src/**'
      - 'jobpilot/web/**'
      - '.github/workflows/jobpilot.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  # Les recherches passent l'une après l'autre ; chaque candidature a son propre créneau.
  group: ${{ inputs.apply != '' && format('jobpilot-apply-{0}', github.run_id) || 'jobpilot-search' }}
  cancel-in-progress: false

env:
  MODE: ${{ inputs.apply != '' && 'apply' || 'search' }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: jobpilot
    env:
      FT_CLIENT_ID: ${{ secrets.FT_CLIENT_ID }}
      FT_CLIENT_SECRET: ${{ secrets.FT_CLIENT_SECRET }}
      ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      AUTO_SEND: ${{ vars.AUTO_SEND }}
      CV_PHONE: ${{ secrets.CV_PHONE }}
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: jobpilot/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Adresse du site
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"; REPO="${GITHUB_REPOSITORY#*/}"
          echo "SITE_URL=https://${OWNER,,}.github.io/${REPO}" >> "$GITHUB_ENV"
      - name: Tests (dont le contrôle anti-mensonge)
        if: env.MODE == 'search'
        run: npm test

      - name: Rechercher les offres
        if: env.MODE == 'search'
        run: node src/fetch-jobs.mjs

      - name: Candidatures automatiques
        if: env.MODE == 'search'
        run: node src/auto-apply.mjs

      - name: Préparer les candidatures demandées
        if: env.MODE == 'apply'
        env:
          REQUESTED: ${{ inputs.apply }}
        run: |
          IDS=$(node -e '
            const fs = require("fs");
            const all = require("./data/jobs.json").jobs.concat(fs.existsSync("./data/companies.json") ? require("./data/companies.json").companies : []);
            const asked = (process.env.REQUESTED || "").split(/\s+/);
            console.log(all.filter(j => asked.includes(j.id)).map(j => j.id).join(" "));
          ')
          if [ -z "$IDS" ]; then echo "Aucune offre reconnue."; exit 1; fi
          node src/apply.mjs $IDS

      - name: Sauvegarder les données
        run: |
          git config user.name "jobpilot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Rien de nouveau."; exit 0; fi
          if [ "$MODE" = apply ]; then MSG="candidature préparée"; else MSG="mise à jour des offres"; fi
          git commit -q -m "JobPilot : $MSG [skip ci]"
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 3))
          done
          exit 1

      - name: Construire le site
        if: env.MODE == 'search'
        run: node src/build-site.mjs
      - uses: actions/upload-pages-artifact@v3
        if: env.MODE == 'search'
        with:
          path: jobpilot/site

  deploy:
    needs: run
    if: ${{ inputs.apply == '' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
