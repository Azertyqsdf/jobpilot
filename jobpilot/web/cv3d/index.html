<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parcours — le film</title>
<meta name="description" content="Mon CV, raconté comme un film en 3D.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="film.css">
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>
<div class="grain" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>
<div class="bar top" aria-hidden="true"></div>
<div class="bar bottom" aria-hidden="true"></div>

<main id="stage" aria-live="polite">
  <div id="kicker" class="kicker"></div>
  <h1 id="headline" class="headline"></h1>
  <p id="sub" class="sub"></p>
  <p id="subtitle" class="subtitle"></p>
  <section id="credits" class="credits" hidden></section>
</main>

<div id="start" class="start">
  <div class="start-inner">
    <div class="start-kicker" id="startKicker">Un CV pas comme les autres</div>
    <img class="start-photo" id="startPhoto" src="../photo.jpg" alt="" onerror="this.remove()">
    <div class="start-name" id="startName">…</div>
    <button id="play" class="play" type="button" disabled><span>▶</span> Lancer le film</button>
    <div class="start-hint">≈ 1 min 30 · Espace : pause · ← → : chapitres</div>
    <a class="start-classic" id="classic" href="../">Version classique</a>
  </div>
</div>

<nav id="controls" class="controls" hidden>
  <button id="toggle" type="button" aria-label="Pause">❚❚</button>
  <div id="track" class="track" role="slider" aria-label="Progression du film" tabindex="0"><div id="fill" class="fill"></div></div>
  <span id="chapter" class="chapter-label"></span>
  <button id="skip" type="button">Générique ⏭</button>
</nav>

<script type="module" src="film.js"></script>
</body>
</html>
